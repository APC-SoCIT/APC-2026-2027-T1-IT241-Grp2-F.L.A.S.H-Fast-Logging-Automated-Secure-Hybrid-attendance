<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F.L.A.S.H. Portal</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent: #3b82f6;
      --dark: #0f172a;
      --text: #334155;
      --text-light: #64748b;
      --card-bg: rgba(255, 255, 255, 0.92);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    .bg-overlay {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.75) 0%, rgba(30, 41, 59, 0.6) 100%), 
                  url('https://cdn.manilastandard.net/wp-content/uploads/2024/06/B2-3apc-696x366.jpeg') no-repeat center center/cover;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 24px;
      width: 100%;
      max-width: 820px;
      min-height: 440px;
      display: flex;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      margin: 20px;
    }

    .brand-side {
      width: 45%;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      padding: 48px 36px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #ffffff;
      position: relative;
    }

    .brand-side::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at top right, rgba(37, 99, 235, 0.25), transparent 70%);
      pointer-events: none;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      background: var(--primary);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.2rem;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    }

    .brand-title {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .brand-desc {
      color: #94a3b8;
      font-size: 0.88rem;
      line-height: 1.6;
      margin-top: auto;
    }

    .form-side {
      width: 55%;
      padding: 48px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .view-panel {
      width: 100%;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .header-text h2 {
      font-size: 1.5rem;
      color: var(--dark);
      font-weight: 700;
      margin-bottom: 6px;
    }

    .header-text p {
      font-size: 0.85rem;
      color: var(--text-light);
      margin-bottom: 32px;
    }

    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      width: 100%;
      padding: 14px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.4);
    }

    .btn-secondary {
      background-color: #f1f5f9;
      color: var(--text);
      border: 1px solid #e2e8f0;
    }

    .btn-secondary:hover {
      background-color: #e2e8f0;
      color: var(--dark);
    }

    .roles-panel {
      display: none;
      opacity: 0;
      transform: translateX(10px);
    }

    .roles-panel.active {
      display: flex;
      flex-direction: column;
      opacity: 1;
      transform: translateX(0);
    }

    .btn-role {
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      color: var(--dark);
      justify-content: font-start;
      padding: 14px 18px;
    }

    .btn-role:hover {
      border-color: var(--primary);
      background-color: #eff6ff;
      color: var(--primary);
    }

    .back-link {
      margin-top: 16px;
      font-size: 0.85rem;
      color: var(--text-light);
      cursor: pointer;
      text-align: center;
      font-weight: 600;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: var(--dark);
    }
  </style>
</head>
<body>

  <div class="bg-overlay">
    <div class="login-card">
      
      <div class="brand-side">
        <div class="brand-badge">
          <div class="brand-icon">F</div>
          <h1 class="brand-title">F.L.A.S.H</h1>
        </div>
        <p class="brand-desc">Fast Logging Automated Secure Hybrid Attendance.</p>
      </div>

      <div class="form-side">
        
        <div id="landingView" class="view-panel">
          <div class="header-text">
            <h2>Welcome Back</h2>
            <p>Please log in with your institutional account to continue.</p>
          </div>
          <div class="btn-container">
            <button class="btn btn-primary" onclick="showRoles()">Log In</button>
            <button class="btn btn-secondary" onclick="handleBack()">Back</button>
          </div>
        </div>

        <div id="rolesView" class="view-panel roles-panel">
          <div class="header-text">
            <h2>Select Role</h2>
            <p>Choose your account type to proceed.</p>
          </div>
          <div class="btn-container">
            <button class="btn btn-role" onclick="handleRoleSelect('STUDENT')">Student</button>
            <button class="btn btn-role" onclick="handleRoleSelect('PROFESSOR')">Faculty / Professor</button>
            <button class="btn btn-role" onclick="handleRoleSelect('DIRECTOR')">Academic Director</button>
          </div>
          <span class="back-link" onclick="showLanding()">← Back to main</span>
        </div>

      </div>

    </div>
  </div>

  <script>
    function showRoles() {
      document.getElementById('landingView').style.display = 'none';
      const roles = document.getElementById('rolesView');
      roles.classList.add('active');
    }

    function showLanding() {
      const roles = document.getElementById('rolesView');
      roles.classList.remove('active');
      document.getElementById('landingView').style.display = 'block';
    }

    function handleBack() {
      alert("Navigating back to main portal...");
    }

    function handleRoleSelect(role) {
      alert(`Initiating sign-in for: ${role}`);
    }
  </script>
</body>
</html>
